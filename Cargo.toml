[package]
name = "check-license"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "check-license"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"
